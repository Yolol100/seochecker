name: Apply final hardening

on:
  push:
    branches:
      - fix/final-hardening-20260817
    paths:
      - '.github/workflows/apply-final-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use locked Lighthouse tooling and bounded jobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/seo-audit.yml')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          once(
              "    paths:\n      - 'requests/audit.json'",
              "    paths:\n      - 'requests/audit.json'\n      - 'package.json'\n      - 'package-lock.json'\n      - 'scripts/**'\n      - 'tests/**'\n      - '.github/workflows/seo-audit.yml'",
              'main validation paths',
          )
          once(
              "  self-test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n      - name: Test checker",
              "  self-test:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n      - name: Set up Node.js\n        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0\n        with:\n          node-version: '22'\n          cache: npm\n      - name: Install locked Node tooling\n        run: npm ci --ignore-scripts --no-audit --no-fund\n      - name: Verify locked Lighthouse version\n        run: node -e \"const p=require('./node_modules/@lhci/cli/package.json'); if(p.version!=='0.15.1') process.exit(1)\"\n      - name: Test checker",
              'self-test locked tooling',
          )
          once(
              "  resolve-request:\n    if: github.event_name != 'pull_request'\n    runs-on: ubuntu-latest\n    outputs:",
              "  resolve-request:\n    if: github.event_name != 'pull_request'\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    outputs:",
              'resolve timeout',
          )
          once(
              "    runs-on: ubuntu-latest\n    env:\n      TARGET_URL:",
              "    runs-on: ubuntu-latest\n    timeout-minutes: 35\n    env:\n      TARGET_URL:",
              'audit timeout',
          )
          once(
              "      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n\n      - name: Validate public target",
              "      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n\n      - name: Set up Node.js\n        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0\n        with:\n          node-version: '22'\n          cache: npm\n\n      - name: Install locked Node tooling\n        run: npm ci --ignore-scripts --no-audit --no-fund\n\n      - name: Validate public target",
              'audit locked install',
          )
          once(
              "      - name: Install Lighthouse CI\n        run: npm install --global @lhci/cli@0.15.1\n\n      - name: Lighthouse CI collection\n        id: lighthouse\n        continue-on-error: true\n        run: lhci collect --url=\"$TARGET_URL\" --numberOfRuns=1",
              "      - name: Lighthouse CI collection\n        id: lighthouse\n        continue-on-error: true\n        run: npx --no-install lhci collect --url=\"$TARGET_URL\" --numberOfRuns=1",
              'local lighthouse execution',
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'npx --no-install lhci collect' .github/workflows/seo-audit.yml
          ! grep -q 'npm install --global @lhci/cli' .github/workflows/seo-audit.yml
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/@lhci/cli']?.version!=='0.15.1') process.exit(1)"
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/seo-audit.yml
          git commit -m 'ci: use locked Lighthouse tooling'
          git push origin HEAD:fix/final-hardening-20260817
