name: Temporary security lock refresh
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/temporary-secure-lock.yml
permissions:
  contents: write
jobs:
  lock-refresh:
    if: github.repository == 'Yolol100/seochecker' && github.event.pull_request.head.repo.full_name == 'Yolol100/seochecker' && github.event.pull_request.head.ref == 'quality/security-glob-minimatch-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/security-glob-minimatch-20261105
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Regenerate only dependency lock without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check patched versions and install
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          for (const [key, version] of Object.entries({glob:'14.0.3', minimatch:'11.0.4'})) {
            if (pkg.overrides?.[key] !== version) throw Error('Unsafe override: ' + key);
            const nodes = Object.entries(lock.packages).filter(([path]) => path.endsWith('/node_modules/' + key) || path === 'node_modules/' + key);
            if (!nodes.length || nodes.some(([,x]) => x.version !== version)) throw Error('Unpatched lock: ' + key);
          }
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls glob minimatch lighthouse
          npm audit --audit-level=high --no-fund
      - name: Write reviewed lockfile only to this repository branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: quality/security-glob-minimatch-20261105
        run: |
          set -euo pipefail
          test "$BRANCH" = "quality/security-glob-minimatch-20261105"
          SHA="$(gh api "repos/Yolol100/seochecker/contents/package-lock.json?ref=$BRANCH" --jq '.sha')"
          export SHA
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('/tmp/secure-seo-lock.json', JSON.stringify({
            message: 'security: lock patched glob and minimatch for Lighthouse',
            branch: process.env.BRANCH, sha: process.env.SHA,
            content: fs.readFileSync('package-lock.json').toString('base64')
          }));
          NODE
          gh api --method PUT repos/Yolol100/seochecker/contents/package-lock.json --input /tmp/secure-seo-lock.json --jq '.commit.sha'
