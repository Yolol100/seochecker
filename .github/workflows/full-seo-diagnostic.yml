name: Full SEO Diagnostic

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Publieke URL die volledig gecontroleerd moet worden"
        required: true
        type: string
      expected_lang:
        description: "Verwachte HTML-taal (bijv. de, nl, en)"
        required: false
        default: "de"
        type: string
      country_code:
        description: "GSC landcode ISO alpha-3 (bijv. DEU, NLD)"
        required: false
        default: "DEU"
        type: string
      language_code:
        description: "Taalcode voor GSC URL Inspection (bijv. de-DE)"
        required: false
        default: "de-DE"
        type: string
      gsc_property:
        description: "Optioneel: exacte GSC property, bijv. sc-domain:example.com"
        required: false
        default: ""
        type: string
      history_days:
        description: "Aantal dagen historie voor GSC/Ahrefs"
        required: false
        default: "180"
        type: string
      include_gsc:
        description: "Gebruik GSC API als secrets + property zijn ingesteld"
        required: false
        default: true
        type: boolean
      include_ahrefs:
        description: "Gebruik Ahrefs API als AHREFS_API_KEY is ingesteld"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify locked Lighthouse version
        run: node -e "const p=require('./node_modules/@lhci/cli/package.json'); if(p.version!=='0.15.1') process.exit(1)"
      - name: Test checker
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m py_compile scripts/*.py tests/*.py

  diagnostic:
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_URL: ${{ inputs.url }}
      EXPECTED_LANG: ${{ inputs.expected_lang }}
      COUNTRY_CODE: ${{ inputs.country_code }}
      LANGUAGE_CODE: ${{ inputs.language_code }}
      GSC_PROPERTY: ${{ inputs.gsc_property }}
      HISTORY_DAYS: ${{ inputs.history_days }}
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
      AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
      SITEONE_VERSION: "2.5.1"
      SITEONE_SHA256: "09278d958d4a087fa46093805cd33b085b96618001dd31d45c448ad724c9024e"
      VNU_ASSET_ID: "515207969"
      VNU_SHA256: "c70279e260e5f4f9e95b3890ef6c9548f90ebdaec2a75219ec41694ab6241e34"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate public target
        run: python3 scripts/validate_target.py "$TARGET_URL"
      - name: Prepare report directories
        run: mkdir -p reports tools/siteone

      - name: Core SEO and indexability check
        id: basic
        continue-on-error: true
        run: python3 scripts/seo_basic_check.py "$TARGET_URL" --output reports/basic-seo.json --fail-on-indexability

      - name: Language and hreflang probe
        id: language
        continue-on-error: true
        run: python3 scripts/language_probe.py "$TARGET_URL" --expected-lang "$EXPECTED_LANG" --output reports/language-report.json

      - name: Install pinned SiteOne Crawler
        run: |
          curl -fsSL "https://github.com/janreges/siteone-crawler/releases/download/v${SITEONE_VERSION}/siteone-crawler-v${SITEONE_VERSION}-linux-x64.tar.gz" -o /tmp/siteone.tar.gz
          echo "${SITEONE_SHA256}  /tmp/siteone.tar.gz" | sha256sum -c -
          tar -xzf /tmp/siteone.tar.gz -C tools/siteone
          SITEONE_BIN="$(find tools/siteone -type f -name siteone-crawler -perm -111 | head -n 1)"
          test -n "$SITEONE_BIN"
          echo "SITEONE_BIN=$SITEONE_BIN" >> "$GITHUB_ENV"

      - name: SiteOne technical crawl
        id: siteone
        continue-on-error: true
        run: |
          "$SITEONE_BIN" \
            --url="$TARGET_URL" \
            --max-reqs-per-sec=5 \
            --output-html-report=reports/siteone.html \
            --output-json-file=reports/siteone.json \
            --output-text-file=reports/siteone.txt

      - name: Lighthouse CI collection
        id: lighthouse
        continue-on-error: true
        run: npx --no-install lhci collect --url="$TARGET_URL" --numberOfRuns=1

      - name: Set up Java 17 for local Nu Checker
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned local Nu HTML Checker
        run: |
          curl -fsSL \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/validator/validator/releases/assets/${VNU_ASSET_ID}" \
            -o tools/vnu.jar
          echo "${VNU_SHA256}  tools/vnu.jar" | sha256sum -c -
          java -jar tools/vnu.jar --version
      - name: Local Nu HTML validation
        id: vnu
        continue-on-error: true
        run: |
          java -jar tools/vnu.jar \
            --exit-zero-always \
            --stdout \
            --format json \
            "$TARGET_URL" > reports/w3c-nu.json
          test -s reports/w3c-nu.json

      - name: Derive Ahrefs target
        id: target
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from urllib.parse import urlparse
          host = urlparse(os.environ["TARGET_URL"]).hostname or ""
          print(f"ahrefs_target={host}")
          PY

      - name: Google Search Console report
        id: gsc
        if: ${{ inputs.include_gsc }}
        continue-on-error: true
        run: |
          python3 scripts/gsc_report.py \
            --site-url "$GSC_PROPERTY" \
            --inspection-url "$TARGET_URL" \
            --country-code "$COUNTRY_CODE" \
            --language-code "$LANGUAGE_CODE" \
            --days "$HISTORY_DAYS" \
            --output reports/gsc-report.json

      - name: Write skipped GSC report
        if: ${{ !inputs.include_gsc }}
        run: printf '%s\n' '{"status":"skipped","reason":"include_gsc=false"}' > reports/gsc-report.json

      - name: Ahrefs backlink report
        id: ahrefs
        if: ${{ inputs.include_ahrefs }}
        continue-on-error: true
        run: |
          python3 scripts/ahrefs_report.py \
            --target "${{ steps.target.outputs.ahrefs_target }}" \
            --days "$HISTORY_DAYS" \
            --output reports/ahrefs-report.json

      - name: Write skipped Ahrefs report
        if: ${{ !inputs.include_ahrefs }}
        run: printf '%s\n' '{"status":"skipped","reason":"include_ahrefs=false"}' > reports/ahrefs-report.json

      - name: Build combined diagnostic
        id: summary
        if: always()
        run: |
          python3 scripts/build_diagnostic_report.py \
            --target-url "$TARGET_URL" \
            --output-json reports/diagnostic-summary.json \
            --output-md reports/diagnostic-summary.md

      - name: Publish diagnostic summary
        if: always()
        run: |
          if [ -f reports/diagnostic-summary.md ]; then
            cat reports/diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "## Uitvoeringsstatus"
            echo ""
            echo "| Controle | Status |"
            echo "|---|---|"
            echo "| Indexability/basic SEO | ${{ steps.basic.outcome }} |"
            echo "| Language/hreflang | ${{ steps.language.outcome }} |"
            echo "| SiteOne crawl | ${{ steps.siteone.outcome }} |"
            echo "| Lighthouse CI | ${{ steps.lighthouse.outcome }} |"
            echo "| Local Nu HTML | ${{ steps.vnu.outcome }} |"
            echo "| GSC adapter | ${{ steps.gsc.outcome }} |"
            echo "| Ahrefs adapter | ${{ steps.ahrefs.outcome }} |"
            echo "| Combined report | ${{ steps.summary.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-diagnostic-report
          path: |
            reports/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce technical execution gate
        if: always()
        run: |
          failed=0
          [ "${{ steps.basic.outcome }}" = "success" ] || failed=1
          [ "${{ steps.siteone.outcome }}" = "success" ] || failed=1
          [ "${{ steps.lighthouse.outcome }}" = "success" ] || failed=1
          [ "${{ steps.vnu.outcome }}" = "success" ] || failed=1
          [ "${{ steps.summary.outcome }}" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "Een of meer verplichte technische controles zijn niet succesvol uitgevoerd. Bekijk het artifact en de logs."
            exit 1
          fi
