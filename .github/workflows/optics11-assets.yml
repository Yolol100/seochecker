name: Optics11 Case Visual Assets

on:
  push:
    branches:
      - runtime/optics11-life-20260916-2000
    paths:
      - '.github/workflows/optics11-assets.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download broad public assets referenced by current Optics11 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          pages=(
            'https://www.optics11life.com/'
            'https://www.optics11life.com/products/'
            'https://www.optics11life.com/service-support/'
            'https://www.optics11life.com/resources/'
            'https://www.optics11life.com/contact/'
            'https://www.optics11life.com/solutions/'
            'https://www.optics11life.com/product/pavone/'
            'https://www.optics11life.com/product/cuore/'
            'https://www.optics11life.com/product/piuma/'
            'https://www.optics11life.com/product/chiaro/'
          )
          : > assets/pages.txt
          : > assets/all-pages.html
          for page in "${pages[@]}"; do
            echo "$page" >> assets/pages.txt
            curl -fsSL --proto '=https' --tlsv1.2 "$page" >> assets/all-pages.html || true
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('assets/all-pages.html').read_text('utf-8', errors='ignore')
          urls = sorted(set(re.findall(r'https://www\.optics11life\.com/wp-content/uploads/[^\"\'\s)<>]+', html)))
          urls = [u.replace('&amp;', '&') for u in urls if re.search(r'\.(?:png|jpe?g|webp|svg)(?:\?.*)?$', u, re.I)]
          Path('assets/image-urls.txt').write_text('\n'.join(urls) + ('\n' if urls else ''), encoding='utf-8')
          focus = re.compile(r'(pavone|cuore|piuma|chiaro|optics11|service|training|support|hq|headquarters|20231018|mechanobiology|contractility|application|sample|lab|muscle|spheroid|organoid|newsletter|white|logo|nano|fiber|indent)', re.I)
          selected = [u for u in urls if focus.search(u)] or urls
          Path('assets/selected-image-urls.txt').write_text('\n'.join(selected[:80]) + ('\n' if selected else ''), encoding='utf-8')
          print(f'found {len(urls)} images; selected {len(selected[:80])}')
          PY
          cp assets/image-urls.txt assets/image-urls-full.txt
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            base="${url%%\?*}"
            ext="${base##*.}"
            ext="${ext,,}"
            case "$ext" in jpg|jpeg|png|webp|svg) ;; *) ext="bin" ;; esac
            curl -fsSL --proto '=https' --tlsv1.2 "$url" -o "assets/asset-$(printf '%03d' "$n").$ext" || true
          done < assets/selected-image-urls.txt
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/2024/01/Optics11-Square.png' -o assets/pavone.png
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/cuore_persprective_nobg.png' -o assets/cuore.png
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/Optics11-Life-Piuma.png' -o assets/piuma.png
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/chiaro_extremeversatilityandfelx.webp' -o assets/chiaro.webp
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/20231018_0172_00227-1024x683.webp' -o assets/home-hero.webp
          curl -fsSL --proto '=https' --tlsv1.2 'https://www.optics11life.com/wp-content/uploads/optics11-life-white.svg' -o assets/logo-white.svg
          file assets/* | tee assets/file-report.txt
      - name: Upload visual assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optics11-public-visual-assets
          path: assets/
          retention-days: 7
