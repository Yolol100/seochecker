name: SEO Audit

on:
  pull_request:
  push:
    branches: [main, 'runtime/**']
    paths:
      - 'requests/audit.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'toolkit-contract.json'
      - '.github/workflows/seo-audit.yml'
  workflow_dispatch:
    inputs:
      url:
        description: "Publieke basis-URL die technisch gecontroleerd moet worden"
        required: true
        type: string
      url_list:
        description: "Optioneel: extra publieke URL's, een per regel. Blijft runtime-input."
        required: false
        type: string
      render_js:
        description: "Voer daarnaast een SiteOne browser/rendered-DOM crawl uit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify locked Lighthouse version
        run: node -e "const p=require('./node_modules/@lhci/cli/package.json'); if(p.version!=='0.15.1') process.exit(1)"
      - name: Test checker
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m py_compile scripts/*.py tests/*.py

  resolve-request:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      target_url: ${{ steps.resolve.outputs.target_url }}
      source_set_version: ${{ steps.resolve.outputs.source_set_version }}
      url_list_b64: ${{ steps.resolve.outputs.url_list_b64 }}
      render_js: ${{ steps.resolve.outputs.render_js }}
    steps:
      - name: Checkout request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve source-bound request
        id: resolve
        shell: bash
        env:
          DISPATCH_URL: ${{ inputs.url }}
          DISPATCH_URL_LIST: ${{ inputs.url_list }}
          DISPATCH_RENDER_JS: ${{ inputs.render_js }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          const write = (k, v) => fs.appendFileSync(out, `${k}=${String(v)}\n`);
          const safeText = (v) => typeof v === 'string' && v.trim().length > 0 && !/[\r\n]/.test(v);
          const safeId = (v) => typeof v === 'string' && /^[A-Za-z0-9._-]{3,80}$/.test(v);
          const publicUrl = (v) => { const u = new URL(v); if (!['http:', 'https:'].includes(u.protocol)) throw new Error('URL must be HTTP(S)'); return u.toString(); };
          let run = false;
          let requestId = 'none';
          let targetUrl = '';
          let sourceSetVersion = '';
          let urls = [];
          let renderJs = false;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            targetUrl = publicUrl(process.env.DISPATCH_URL || '');
            urls = [targetUrl];
            for (const raw of String(process.env.DISPATCH_URL_LIST || '').split(/\r?\n/)) {
              const value = raw.trim();
              if (value) urls.push(publicUrl(value));
            }
            renderJs = String(process.env.DISPATCH_RENDER_JS || '').toLowerCase() === 'true';
            run = true;
            requestId = `dispatch-${process.env.GITHUB_RUN_ID}`;
          } else if (fs.existsSync('requests/audit.json')) {
            const req = JSON.parse(fs.readFileSync('requests/audit.json', 'utf8'));
            if (req.enabled === true) {
              if (!safeId(req.request_id)) throw new Error('invalid request_id');
              if (req.owner !== 'seo' || req.project_id !== 'project-seo') throw new Error('request owner/project mismatch');
              for (const key of ['for', 'task', 'why', 'trigger_when', 'do_not_trigger_when', 'requested_by']) {
                if (!safeText(req[key])) throw new Error(`missing or unsafe ${key}`);
              }
              if (!req.source_context || req.source_context.project_id !== 'project-seo' || !safeText(req.source_context.source_set_version)) {
                throw new Error('invalid source_context');
              }
              targetUrl = publicUrl(req.url || '');
              urls = [targetUrl];
              if (Array.isArray(req.urls)) for (const value of req.urls) urls.push(publicUrl(value));
              renderJs = req.render_js === true;
              sourceSetVersion = req.source_context.source_set_version.trim();
              run = true;
              requestId = req.request_id;
            }
          }
          urls = [...new Set(urls)].slice(0, 500);
          write('run', run ? 'true' : 'false');
          write('request_id', requestId);
          write('target_url', targetUrl);
          write('source_set_version', sourceSetVersion);
          write('url_list_b64', Buffer.from(urls.join('\n'), 'utf8').toString('base64'));
          write('render_js', renderJs ? 'true' : 'false');
          NODE

  audit:
    if: needs.resolve-request.outputs.run == 'true'
    needs: [self-test, resolve-request]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_URL: ${{ needs.resolve-request.outputs.target_url }}
      REQUEST_ID: ${{ needs.resolve-request.outputs.request_id }}
      SOURCE_SET_VERSION: ${{ needs.resolve-request.outputs.source_set_version }}
      URL_LIST_B64: ${{ needs.resolve-request.outputs.url_list_b64 }}
      RENDER_JS: ${{ needs.resolve-request.outputs.render_js }}
      SITEONE_VERSION: "2.5.1"
      SITEONE_SHA256: "09278d958d4a087fa46093805cd33b085b96618001dd31d45c448ad724c9024e"
      VNU_ASSET_ID: "515207969"
      VNU_SHA256: "c70279e260e5f4f9e95b3890ef6c9548f90ebdaec2a75219ec41694ab6241e34"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare bounded runtime URL list
        run: |
          mkdir -p reports tools/siteone
          printf '%s' "$URL_LIST_B64" | base64 --decode > reports/runtime-urls.txt
          test -s reports/runtime-urls.txt
          while IFS= read -r url; do
            [ -z "$url" ] || python3 scripts/validate_target.py "$url"
          done < reports/runtime-urls.txt
      - name: Core SEO and indexability check
        id: basic
        continue-on-error: true
        run: python3 scripts/seo_basic_check.py "$TARGET_URL" --output reports/basic-seo.json --fail-on-indexability
      - name: Stable bounded URL batch evidence
        id: batch
        continue-on-error: true
        run: python3 scripts/run_url_batch.py --url-list reports/runtime-urls.txt --output reports/url-batch.json --max-urls 500
      - name: Normalize technical findings
        id: normalize
        if: steps.batch.outcome == 'success'
        run: python3 scripts/technical_evidence.py normalize --input reports/url-batch.json --output reports/technical-findings.json --graph-output reports/technical-graph.json
      - name: Extract discovered sitemap URLs
        id: sitemap
        if: steps.batch.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/extract_sitemap_urls.py --input reports/url-batch.json --output reports/sitemap-urls.txt --report reports/sitemap-extraction.json
      - name: Reconcile crawl and sitemap
        id: reconcile
        if: steps.normalize.outcome == 'success' && steps.sitemap.outcome == 'success'
        run: python3 scripts/technical_evidence.py normalize --input reports/url-batch.json --output reports/technical-findings.json --sitemap-list reports/sitemap-urls.txt --graph-output reports/technical-graph.json
      - name: Install pinned SiteOne Crawler
        run: |
          curl -fsSL "https://github.com/janreges/siteone-crawler/releases/download/v${SITEONE_VERSION}/siteone-crawler-v${SITEONE_VERSION}-linux-x64.tar.gz" -o /tmp/siteone.tar.gz
          echo "${SITEONE_SHA256}  /tmp/siteone.tar.gz" | sha256sum -c -
          tar -xzf /tmp/siteone.tar.gz -C tools/siteone
          SITEONE_BIN="$(find tools/siteone -type f -name siteone-crawler -perm -111 | head -n 1)"
          test -n "$SITEONE_BIN"
          echo "SITEONE_BIN=$SITEONE_BIN" >> "$GITHUB_ENV"
      - name: SiteOne technical crawl
        id: siteone
        continue-on-error: true
        run: |
          "$SITEONE_BIN" \
            --url="$TARGET_URL" \
            --url-list=reports/runtime-urls.txt \
            --max-reqs-per-sec=5 \
            --output-html-report=reports/siteone.html \
            --output-json-file=reports/siteone.json \
            --output-text-file=reports/siteone.txt
      - name: SiteOne rendered browser crawl
        id: siteone_rendered
        if: env.RENDER_JS == 'true'
        continue-on-error: true
        run: |
          "$SITEONE_BIN" \
            --url="$TARGET_URL" \
            --url-list=reports/runtime-urls.txt \
            --browser \
            --max-reqs-per-sec=3 \
            --output-html-report=reports/siteone-rendered.html \
            --output-json-file=reports/siteone-rendered.json \
            --output-text-file=reports/siteone-rendered.txt
      - name: Lighthouse CI collection
        id: lighthouse
        continue-on-error: true
        run: npx --no-install lhci collect --url="$TARGET_URL" --numberOfRuns=3
      - name: Normalize Lighthouse evidence
        id: lighthouse_summary
        if: steps.lighthouse.outcome == 'success'
        run: python3 scripts/lighthouse_summary.py --input-dir .lighthouseci --output reports/lighthouse-summary.json
      - name: Set up Java 17 for local Nu Checker
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned local Nu HTML Checker
        run: |
          curl -fsSL \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/validator/validator/releases/assets/${VNU_ASSET_ID}" \
            -o tools/vnu.jar
          echo "${VNU_SHA256}  tools/vnu.jar" | sha256sum -c -
          java -jar tools/vnu.jar --version
      - name: Local Nu HTML validation
        id: vnu
        continue-on-error: true
        run: |
          java -jar tools/vnu.jar \
            --exit-zero-always \
            --stdout \
            --format json \
            "$TARGET_URL" > reports/w3c-nu.json
          test -s reports/w3c-nu.json
      - name: Build evidence manifest
        id: evidence_manifest
        if: always()
        run: |
          python3 scripts/build_evidence_manifest.py \
            --workflow "SEO Audit" \
            --target-url "$TARGET_URL" \
            --request-id "$REQUEST_ID" \
            --source-set-version "$SOURCE_SET_VERSION" \
            --artifact runtime-urls=reports/runtime-urls.txt \
            --artifact basic=reports/basic-seo.json \
            --artifact url-batch=reports/url-batch.json \
            --artifact technical-findings=reports/technical-findings.json \
            --artifact technical-graph=reports/technical-graph.json \
            --artifact sitemap-extraction=reports/sitemap-extraction.json \
            --artifact sitemap-urls=reports/sitemap-urls.txt \
            --artifact siteone-json=reports/siteone.json \
            --artifact siteone-html=reports/siteone.html \
            --artifact siteone-rendered-json=reports/siteone-rendered.json \
            --artifact siteone-rendered-html=reports/siteone-rendered.html \
            --artifact lighthouse-summary=reports/lighthouse-summary.json \
            --artifact lighthouse-raw=.lighthouseci \
            --artifact w3c-nu=reports/w3c-nu.json \
            --output reports/evidence-manifest.json
      - name: Write audit summary
        if: always()
        run: |
          {
            echo "## SEO Audit"
            echo ""
            echo "Request: $REQUEST_ID"
            echo "Source set: ${SOURCE_SET_VERSION:-not-provided}"
            echo "Target: $TARGET_URL"
            echo "Rendered crawl requested: $RENDER_JS"
            echo ""
            echo "| Controle | Status |"
            echo "|---|---|"
            echo "| Indexability/basic SEO | ${{ steps.basic.outcome }} |"
            echo "| Bounded URL batch | ${{ steps.batch.outcome }} |"
            echo "| Technical normalization | ${{ steps.normalize.outcome }} |"
            echo "| Sitemap extraction | ${{ steps.sitemap.outcome }} |"
            echo "| Sitemap reconciliation | ${{ steps.reconcile.outcome }} |"
            echo "| SiteOne crawl | ${{ steps.siteone.outcome }} |"
            echo "| SiteOne rendered crawl | ${{ steps.siteone_rendered.outcome }} |"
            echo "| Lighthouse CI | ${{ steps.lighthouse.outcome }} |"
            echo "| Lighthouse summary | ${{ steps.lighthouse_summary.outcome }} |"
            echo "| Local Nu HTML | ${{ steps.vnu.outcome }} |"
            echo "| Evidence manifest | ${{ steps.evidence_manifest.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-audit-report
          path: |
            reports/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce critical execution gate
        if: always()
        run: |
          failed=0
          [ "${{ steps.basic.outcome }}" = "success" ] || failed=1
          [ "${{ steps.batch.outcome }}" = "success" ] || failed=1
          [ "${{ steps.normalize.outcome }}" = "success" ] || failed=1
          [ "${{ steps.siteone.outcome }}" = "success" ] || failed=1
          if [ "$RENDER_JS" = "true" ]; then [ "${{ steps.siteone_rendered.outcome }}" = "success" ] || failed=1; fi
          [ "${{ steps.lighthouse.outcome }}" = "success" ] || failed=1
          [ "${{ steps.lighthouse_summary.outcome }}" = "success" ] || failed=1
          [ "${{ steps.vnu.outcome }}" = "success" ] || failed=1
          [ "${{ steps.evidence_manifest.outcome }}" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "Een of meer kerncontroles zijn niet succesvol uitgevoerd. Bekijk de artefacts en logs."
            exit 1
          fi
