name: Temporary Webactueel branch cleanup 2026-09-20
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete exact obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCHES: |
            runtime/acd-full-fix-20260910-audit|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/acd-full-fix-20260910-evidence|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/acd-full-fix-20260910-final|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/acd-full-fix-20260910-run|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/acd-full-fix-20260910|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/acd-seo-audit-20260909|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/closure-proof-20260911-v2|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/closure-proof-20260911-v3|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/closure-proof-20260911|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/doctorcura-deep-20260820|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/doctorcura-deep-20260821|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/doctorcura-scan-20260822|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/final-contract-proof-20260911|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/final-proof-20260911-v4|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/final-schema-proof-20260912|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/gsc-dca-20260820b|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/gsc-dca-test|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/gsc-doctorcura-20260820|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/gsc-sitemaps-retry|7cad6ced25cafc82bf3f8374a8c0810deb187988
            runtime/seo-data-toolbox|7cad6ced25cafc82bf3f8374a8c0810deb187988
            cleanup/repository-hygiene-20260818-1217|bf230411e7cfe45ecb2d4a145b5b6b1fc5a42a01
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            set +e
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/tmp/referr)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              if grep -Eq 'Reference does not exist|Not Found' /tmp/referr; then
                echo "Already absent: $branch"
                continue
              fi
              cat /tmp/referr >&2
              exit "$rc"
            fi
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch for $branch: expected=$expected actual=$actual" >&2
              exit 3
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done <<< "$EXPECTED_BRANCHES"
